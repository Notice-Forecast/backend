plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nf'
version = '0.0.1-SNAPSHOT'
description = 'Notice Forecast Backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    implementation 'org.jsoup:jsoup:1.24.1'
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'
    implementation 'kr.dogfoot:hwplib:1.1.11'
    implementation 'nl.martijndwars:web-push:5.1.2'
    // web-push가 런타임으로만 끌어오는 라이브러리. send()의 응답 타입과 throws 선언 때문에 컴파일에도 둔다(같은 버전).
    implementation 'org.apache.httpcomponents:httpclient:4.5.13'
    implementation 'org.bitbucket.b_c:jose4j:0.7.9'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.87'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 정확도 실측(POST /internal/metrics/run)이 배포 서버에서 정답셋을 읽도록 jar에 함께 싣는다(CLAUDE.md 15.2).
tasks.named('processResources') {
    from('src/test/resources/eval') {
        include '**/*.json'
        into 'eval'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  # 정기 작업 스레드 2개. 매시간 수집·추출이 몇 분 걸리는 동안 10분 주기 마감 임박 알림이 밀리지 않게 한다.
  # 수집 작업끼리는 NoticeCrawler가 synchronized라 겹치지 않고, 학교 서버 1초 간격은 전역으로 지킨다.
  task:
    scheduling:
      pool:
        size: 2
  application:
    name: notice-forecast-backend
  config:
    import: classpath:notice-sources.yml

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/notice_forecast?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USER:nf_user}
    password: ${DB_PASSWORD:nf_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  llm:
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:claude-haiku-5-5}
    effort: ${LLM_EFFORT:medium}
  # 서류 종류별 기본 소요일(CLAUDE.md 8.3). OTHER는 AI 제안만 쓴다.
  prep:
    lead-days:
      "[RECOMMENDATION]": 7
      "[CERTIFICATE]": 1
      "[SELF_INTRODUCTION]": 3
      "[APPLICATION_FORM]": 1
    no-document-days: 3
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:}
  crawl:
    enabled: ${CRAWL_ENABLED:true}
    include: ${CRAWL_INCLUDE:}
  admin:
    key: ${ADMIN_KEY:}
